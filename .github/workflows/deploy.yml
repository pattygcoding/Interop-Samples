name: Deploy showcase to GitHub Pages

# The dashboard is a built site now (Vue + Vite), so Pages is fed by an artifact
# instead of the repository root: every push to `main` regenerates the showcase data
# from the real repository, builds `dist/` and publishes it.  See README.md
# ("Showcase site" -> "Deploying") for the one-time switch that turns this on.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time, and never cancel one that is already running - a
# half-published site is worse than a slightly older one.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # The current major of each action - the ones that run on Node 24.  The
            # v4-era majors run on Node 20, which GitHub is retiring.
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            # The showcase data is generated by tools/generate_dashboard.py, which
            # `npm run build` runs for us.
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - uses: actions/configure-pages@v6
            - run: npm ci
            - run: npm run build
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
